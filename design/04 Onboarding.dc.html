<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <meta name="design_doc_mode" content="canvas" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
        <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet" />
        <link rel="stylesheet" href="./theme.css" />
        <style>
          .mk { position: relative; width: var(--icon-hero); height: var(--icon-hero); display: flex; align-items: center; justify-content: center; }
          /* The microphone moved to `theme.css` as `.micmark` on 2026-08-19 — it is
             now the SAME glyph the talk ring carries, drawn at the page-mark idiom
             (176 box / 2.5 stroke) instead of the control idiom (160 / 3.5). It
             gained the cradle arc the ring's mic has, and went monochrome `--ink`;
             the old two-tone stand (`--faint` stem and base) is gone, because a
             glyph in this system carries exactly one colour token. */
          .mkbt { width: 76px; height: 76px; border: var(--icon-hero-stroke) solid var(--ink); border-radius: 10px; transform: rotate(45deg); }
          .nc { position: absolute; border-radius: 50%; border: var(--icon-sm-stroke) solid var(--line2); }
          .n1 { inset: 0; }
          .n2 { inset: 30px; border-color: var(--faint); }
          .n3 { inset: 60px; border-color: var(--dim); }
          .ndot { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--green); box-shadow: 0 0 16px var(--green); }
          /* `.okbig` moved to `theme.css` on 2026-08-19 — it is now the ONE success
             mark, shared with `03 Pairing`'s saved step, which used to draw a
             smaller `.oktick` under a 30pt headline. */
        </style>
      </helmet>

      <div class="frame" style="left:48px;top:56px" data-screen-label="Onboarding — Microphone">
        <div class="flabel" data-drags-parent="1">onboarding · 01 microphone</div>
        <div class="phone">
          <div class="sbar"><span>14:32</span><span class="batt"></span></div>
          <div class="obdots" role="img" aria-label="{{ t.step1 }}"><i class="on"></i><i></i><i></i></div>
          <div class="obmark" aria-hidden="true">
            <div class="mk">
              <i class="micmark pagemark"><i class="miccap"></i><i class="miccradle"></i><i class="micstem"></i><i class="micbase"></i></i>
            </div>
          </div>
          <div class="obfoot">
            <div class="obtitle">{{ t.t1 }}</div>
            <div class="obbody">{{ t.b1 }}</div>
            <div class="btn solid">{{ t.a1 }}</div>
          </div>
        </div>
      </div>

      <div class="frame" style="left:498px;top:56px" data-screen-label="Onboarding — Bluetooth">
        <div class="flabel" data-drags-parent="1">onboarding · 02 bluetooth</div>
        <div class="phone">
          <div class="sbar"><span>14:32</span><span class="batt"></span></div>
          <div class="obdots" role="img" aria-label="{{ t.step2 }}"><i class="done"></i><i class="on"></i><i></i></div>
          <div class="obmark" aria-hidden="true">
            <div class="mk"><div class="mkbt"></div></div>
          </div>
          <div class="obfoot">
            <div class="obtitle">Bluetooth</div>
            <div class="obbody">{{ t.b2 }}</div>
            <div class="btn solid">{{ t.a2 }}</div>
          </div>
        </div>
      </div>

      <div class="frame" style="left:948px;top:56px" data-screen-label="Onboarding — Nearby devices">
        <div class="flabel" data-drags-parent="1">onboarding · 03 nearby devices</div>
        <div class="phone">
          <div class="sbar"><span>14:32</span><span class="batt"></span></div>
          <div class="obdots" role="img" aria-label="{{ t.step3 }}"><i class="done"></i><i class="done"></i><i class="on"></i></div>
          <div class="obmark" aria-hidden="true">
            <div class="mk">
              <div class="nc n1"></div>
              <div class="nc n2"></div>
              <div class="nc n3"></div>
              <div class="ndot"></div>
            </div>
          </div>
          <div class="obfoot">
            <div class="obtitle">{{ t.t3 }}</div>
            <div class="obbody">{{ t.b3 }}</div>
            <div class="btn solid">{{ t.a3 }}</div>
          </div>
        </div>
      </div>

      <div class="frame" style="left:1398px;top:56px" data-screen-label="Onboarding — Done">
        <div class="flabel" data-drags-parent="1">onboarding · 04 done</div>
        <div class="phone">
          <div class="sbar"><span>14:32</span><span class="batt"></span></div>
          <!-- all three done and no step left to announce: the title says it -->
          <div class="obdots" aria-hidden="true"><i class="done"></i><i class="done"></i><i class="done"></i></div>
          <div class="obmark" aria-hidden="true">
            <div class="mk"><div class="okbig"></div></div>
          </div>
          <div class="obfoot">
            <div class="obtitle">{{ t.t4 }}</div>
            <div class="obbody">{{ t.b4 }}</div>
            <div class="btn solid">{{ t.a4 }}</div>
          </div>
        </div>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props="{&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;en&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;ru&quot;,&quot;tsType&quot;:&quot;\&quot;en\&quot; | \&quot;ru\&quot;&quot;}}">
      class Component extends DCLogic {
        strings() {
          return {
            en: {
              // step1..step3 are ACCESSIBILITY-ONLY since 2026-08-19: the visible
              // "STEP n OF m" line was deleted because `.obdots` already renders
              // exactly that. The words were not dropped, they moved to the dot
              // row's accessible name — hence sentence case, not the display
              // uppercase the old `.obstep` carried literally.
              step1: "Step 1 of 3",
              step2: "Step 2 of 3",
              step3: "Step 3 of 3",
              t1: "Microphone",
              b1: "Your voice is transmitted only while the button is held. Nothing is recorded — the air is never stored.",
              a1: "Allow microphone",
              b2: "Connects nearby phones and pairs the external PTT button. No internet involved.",
              a2: "Allow Bluetooth",
              t3: "Nearby devices",
              b3: "Phones find each other and connect directly — no servers, no accounts. On iOS this is the “Local Network” permission.",
              a3: "Allow discovery",
              t4: "All set",
              b4: "Whoever is nearby is connected — and hears you. Lock the phone and put it in your pocket.",
              a4: "Go on air"
            },
            ru: {
              // accessibility-only, see the en table
              step1: "Шаг 1 из 3",
              step2: "Шаг 2 из 3",
              step3: "Шаг 3 из 3",
              t1: "Микрофон",
              b1: "Голос передаётся, только пока удержана кнопка. Запись не ведётся — эфир нигде не сохраняется.",
              a1: "Разрешить микрофон",
              b2: "Соединяет телефоны рядом и подключает внешнюю PTT-кнопку. Интернет не используется.",
              a2: "Разрешить Bluetooth",
              t3: "Устройства рядом",
              b3: "Телефоны находят друг друга и соединяются напрямую — без серверов и аккаунтов. На iOS это разрешение «Локальная сеть».",
              a3: "Разрешить поиск",
              t4: "Всё готово",
              b4: "Кто рядом — тот подключён — тот слышит. Телефон можно заблокировать и убрать в карман.",
              a4: "В эфир"
            }
          };
        }
        renderVals() {
          const all = this.strings();
          const lang = this.props.lang === "ru" ? "ru" : "en";
          return { t: all[lang] };
        }
      }
    </script>
  </body>
</html>
